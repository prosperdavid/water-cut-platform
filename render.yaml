databases:
  - name: coupure-toliara-prosperdavid-db
    databaseName: coupure
    user: coupure
    plan: 0.1c-256mb
    region: singapore
    postgresMajorVersion: "17"
    ipAllowList: []

services:
  - type: web
    name: coupure-toliara-prosperdavid-api
    runtime: python
    rootDir: backend
    branch: feature/espace-administration
    region: singapore
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /health/
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        fromService:
          type: web
          name: coupure-toliara-prosperdavid-api
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: coupure-toliara-prosperdavid-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: CSRF_TRUSTED_ORIGINS
        fromService:
          type: web
          name: coupure-toliara-prosperdavid-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATABASE_URL
        fromDatabase:
          name: coupure-toliara-prosperdavid-db
          property: connectionString
      - key: GOOGLE_CLIENT_ID
        value: 233520461332-2gumteneibvedrhcqojgguol09e4n444.apps.googleusercontent.com

  - type: web
    name: coupure-toliara-prosperdavid-web
    runtime: static
    rootDir: frontend
    branch: feature/espace-administration
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: checksPass
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: VITE_API_URL
        fromService:
          type: web
          name: coupure-toliara-prosperdavid-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_GOOGLE_CLIENT_ID
        value: 233520461332-2gumteneibvedrhcqojgguol09e4n444.apps.googleusercontent.com
